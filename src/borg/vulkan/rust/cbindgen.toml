language = "C"

includes = ["vulkan/vulkan_core.h", "util/format/u_formats.h"]
autogen_warning = "/* Warning, this file is autogenerated by cbindgen. Don't modify this manually. */"
include_guard = "BORGVK_RUST_H"
usize_is_size_t = true
after_includes = "struct nir_shader;"
style = "tag"

# Types bindgen took from C keep their C names.
[export.rename]
"vk_sync_type" = "struct vk_sync_type"
"vk_queue" = "struct vk_queue"
"vk_queue_submit" = "struct vk_queue_submit"
"vk_command_buffer_ops" = "struct vk_command_buffer_ops"
"nir_shader" = "struct nir_shader"
"pipe_format" = "enum pipe_format"
"vk_image_view" = "struct vk_image_view"
"vk_buffer_view" = "struct vk_buffer_view"
